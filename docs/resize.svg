  <title id="t">mwm2: resize</title>
  <desc id="d">Holding Left Option, right-dragging the right half of a window to the right widens it, right-dragging the left half to the right narrows it, and right-dragging near the bottom-right corner diagonally grows that corner. An outline follows, and the window takes its size on release.</desc>
