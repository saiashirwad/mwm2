  <title id="t">mwm2</title>
  <desc id="d">Two displays. Holding Left Option, the cursor moves a terminal so it snaps to the screen edge, drags an editor to the outer edge to tile it to the right half, double-clicks the terminal to maximize and restore it, resizes it toward the other display while the outline stops at its own screen, then drags the editor and cancels with Escape.</desc>
